name: CI

on:
  push:
    branches: [main, backend_server]
  pull_request:
    branches: [main, backend_server]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # Проверка Electron-сборки (desktop) — как в release.yml
  build-electron:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build Electron app
        run: npm run build:ci

      - name: Verify Electron artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist-electron/main.js || (echo "dist-electron/main.js missing" && exit 1)
          test -f dist-electron/preload.js || (echo "dist-electron/preload.js missing" && exit 1)
          echo "✓ Electron build artifacts verified"

  # Проверка web-сборки (WEB_ONLY=1) — для деплоя в nginx
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check web build
        run: WEB_ONLY=1 npx tsc --noEmit

      - name: Build web app
        run: WEB_ONLY=1 npx vite build
        env:
          VITE_API_BASE_URL: ''

      - name: Verify web artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -n "$(ls dist/assets/*.js 2>/dev/null)" || (echo "No JS chunks in dist/assets" && exit 1)
          echo "✓ Web build artifacts verified"
          echo "--- Chunk sizes ---"
          ls -lh dist/assets/*.js | awk '{print $9, $5}'

      - name: Verify Docker build
        run: docker build --build-arg VITE_API_BASE_URL="" -t equipment-tracker-web:ci .
