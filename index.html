<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP устанавливается:
         - Electron: в main process (electron/window.ts setupContentSecurityPolicy)
         - Web: nginx (nginx.conf add_header Content-Security-Policy)
         Здесь CSP не дублируется, чтобы не конфликтовать с file:// в Electron. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Система учёта оборудования и выходов сотрудников" />
    <meta name="application-name" content="Equipment Tracker" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./vite.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Equipment Tracker" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipment Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
